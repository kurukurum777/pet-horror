<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ペット詳細</title>
  <style>
    /* 右下に固定する「help me!」ボタンのスタイル */
    #helpBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #ff0000;
      color: white;
      border: 2px solid #000;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,0,0,0.5);
    }
    #helpBtn:hover {
      background-color: #990000;
    }
  </style>
</head>
<body>

  <!-- BGM1をループ再生 (※ブラウザの仕様により画面を1回クリックすると音が鳴り始めます) -->
  <audio id="bgm1" src="bgm1.mp3" autoplay loop></audio>

  <h1 id="name"></h1>
  <p id="type"></p>

  <h2>性格や特徴</h2>
  <ul id="likes"></ul>

  <input id="newLike" placeholder="好きなところ">
  <button id="add">追加</button>

  <!-- help me! ボタン -->
  <button id="helpBtn">help me!</button>

  <script>
    "use strict";
    const id = new URLSearchParams(location.search).get("id");

    function load() {
      fetch(`/api/pets/${id}`)
        .then(res => res.json())
        .then(pet => {
          document.getElementById("name").innerText = pet.name;
          document.getElementById("type").innerText = pet.type;

          const ul = document.getElementById("likes");
          ul.innerHTML = "";
          pet.likes.forEach((like, index) => {
            const li = document.createElement("li");
            li.innerHTML = `${like} <button onclick="removeLike(${index})">削除</button>`;
            ul.appendChild(li);
          });
        });
    }

    // 「help me!」を押したら、そのペットのIDを隠し持って MISSING 画面に移動する
    document.getElementById("helpBtn").onclick = () => {
      location.href = `missing.html?id=${id}`;
    };

    document.getElementById("add").onclick = () => {
      const text = newLike.value;
      fetch(`/api/pets/${id}/likes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      }).then(() => {
        newLike.value = "";
        load();
      });
    };

    function removeLike(index) {
      fetch(`/api/pets/${id}/likes/${index}`, {
        method: "DELETE"
      }).then(load);
    }

    load();
  </script>
</body>
</html>
